services:
  demo:
    build: .
    command: ["node", "--max-old-space-size=256", "demo-server.mjs"]
    init: true
    environment:
      INCIDENTLAB_HOST: 0.0.0.0
    ports:
      - "127.0.0.1:4318:4318"
    read_only: true
    tmpfs:
      - /tmp:size=16m
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 512m
    cpus: 0.5
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4318/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5
