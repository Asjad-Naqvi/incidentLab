services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: incidentlab
      POSTGRES_DB: incidentlab
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD to a URI-safe random password}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U incidentlab -d incidentlab"]
      interval: 5s
      timeout: 5s
      retries: 10
  migrate:
    build: .
    command: ["node", "scripts/migrate.mjs"]
    environment:
      DATABASE_URL: postgresql://incidentlab:${POSTGRES_PASSWORD}@postgres:5432/incidentlab
    depends_on:
      postgres:
        condition: service_healthy
  collector:
    build: .
    environment:
      DATABASE_URL: postgresql://incidentlab:${POSTGRES_PASSWORD}@postgres:5432/incidentlab
      INCIDENTLAB_INGESTION_KEY: ${INCIDENTLAB_INGESTION_KEY:?Set a random ingestion key of at least 24 characters}
      INCIDENTLAB_WORKER_MODE: external
      INCIDENTLAB_HOST: 0.0.0.0
      INCIDENTLAB_PUBLIC_ORIGIN: ${INCIDENTLAB_PUBLIC_ORIGIN:-}
      INCIDENTLAB_COOKIE_SECURE: ${INCIDENTLAB_COOKIE_SECURE:-0}
    ports:
      - "127.0.0.1:4317:4317"
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4317/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5
  worker:
    build: .
    command: ["node", "worker.mjs"]
    environment:
      DATABASE_URL: postgresql://incidentlab:${POSTGRES_PASSWORD}@postgres:5432/incidentlab
    depends_on:
      migrate:
        condition: service_completed_successfully
volumes:
  postgres-data:
